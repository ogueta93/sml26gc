[package]
name = "editor"
description = "Level, object and world map editor writing an edited copy of the cartridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sml26gc_editor"
path = "src/main.rs"

[build-dependencies]
app-resources.workspace = true

[dependencies]
gb-core.workspace = true
cart-model.workspace = true
host.workspace = true
project-model.workspace = true
macroquad.workspace = true
i18n.workspace = true
fonts = { workspace = true, features = ["bundled"] }
cpal.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
ttf-parser = "0.25"
