[package]
name = "host"
description = "Shared adapters to the computer: finding the cartridge, file locations, battery saves, PNG export, the file dialog off Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gb-core.workspace = true
png.workspace = true
i18n.workspace = true
project-model.workspace = true
fonts.workspace = true

# The fonts built in off the web; the page gives the web build its own (`font_files`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fonts = { workspace = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rfd.workspace = true

# The macOS Open and Save panels; the user's preferred languages (CoreFoundation).
[target.'cfg(target_os = "macos")'.dependencies]
rfd.workspace = true
core-foundation-sys = "0.8"
