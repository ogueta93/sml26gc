[alias]
# The release tool: `cargo xtask package <target>`, `cargo xtask targets` (see xtask/).
xtask = "run --quiet --release -p xtask --"

# The C runtime inside the executables: they start on a Windows without the Visual C++
# Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The product's names, read by the build scripts, `host` and the xtask.
[env]
PRODUCT_NAME = "SML2 6GC Emulator and Level Editor"
PRODUCT_ID = "sml26gc"
PRODUCT_SOURCE = "https://github.com/ogueta93/sml26gc"
# Who the Linux .deb names as its maintainer (Debian needs an address).
PRODUCT_MAINTAINER = "The SML2 6GC authors <1623086+ogueta93@users.noreply.github.com>"
# The macOS app bundles' identifier (the editor's adds `.editor`).
PRODUCT_BUNDLE_ID = "io.github.ogueta93.sml26gc"
