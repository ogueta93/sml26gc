[package]
name = "game"
description = "Plays the cartridge on the emulated Game Boy, with pause menu, settings and the editor-made world map."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sml26gc"
path = "src/main.rs"

[build-dependencies]
app-resources.workspace = true

[dependencies]
gb-core.workspace = true
cart-model.workspace = true
i18n.workspace = true
fonts.workspace = true
host.workspace = true
macroquad.workspace = true

[dev-dependencies]
project-model.workspace = true

# Off the web: sound, controllers and the fonts in the program (the page gives the web build its
# own, see `host::web`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
gilrs.workspace = true
fonts = { workspace = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
