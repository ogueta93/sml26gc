[workspace]
resolver = "3"
members = [
    "crates/gb-core",
    "crates/cart-model",
    "crates/host",
    "crates/i18n",
    "crates/fonts",
    "crates/app-resources",
    "crates/project-model",
    "crates/look-capture",
    "crates/capture-worker",
    "game",
    "editor",
    "tools/research",
    "regression",
    "xtask",
]
[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
authors = ["ogueta93 (https://github.com/ogueta93)", "The SML2 6GC authors"]

[workspace.dependencies]
gb-core = { path = "crates/gb-core" }
cart-model = { path = "crates/cart-model" }
host = { path = "crates/host" }
i18n = { path = "crates/i18n" }
fonts = { path = "crates/fonts", default-features = false }
app-resources = { path = "crates/app-resources" }
project-model = { path = "crates/project-model" }
look-capture = { path = "crates/look-capture" }
macroquad = "0.4"
cpal = "0.15"
png = "0.17"
gilrs = "0.11"
# File dialogs: on Linux through the desktop portal (falls back to zenity), no GTK linked; on
# macOS the system's panels.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Globalization", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

# The emulator is too slow to play unoptimised, so even debug builds are optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# The executables that are shipped (`cargo xtask package`): smaller, no debug symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
